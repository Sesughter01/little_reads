<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#0f172a"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#grad)"/>

  <!-- Decorations -->
  
        <circle cx="80" cy="200" r="30" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.3"/>
        <circle cx="80" cy="200" r="15" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
        <circle cx="520" cy="350" r="25" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.25"/>
        <circle cx="520" cy="350" r="12" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.25"/>
        <rect x="460" y="600" width="60" height="60" rx="8" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.2" transform="rotate(45, 490, 630)"/>
      

  <!-- Category -->
  <text x="300" y="100" font-family="Georgia, serif" font-size="14" fill="#22d3ee" text-anchor="middle" letter-spacing="3" opacity="0.7">SCIENCE & TECHNOLOGY</text>

  <!-- Emoji -->
  <text x="300" y="340" font-size="80" text-anchor="middle" opacity="0.9">🤖</text>

  <!-- Title -->
  <text x="300" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="300" dy="0">Tobi's Amazing</tspan><tspan x="300" dy="36">Robot</tspan>
  </text>

  <!-- Divider -->
  <line x1="250" y1="554" x2="350" y2="554" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>

  <!-- Author -->
  <text x="300" y="589" font-family="Georgia, serif" font-size="13" fill="white" text-anchor="middle" opacity="0.6">LittleReads Editorial Team</text>

  <!-- Brand -->
  <rect x="0" y="840" width="600" height="60" fill="black" opacity="0.3"/>
  <text x="300" y="875" font-family="Georgia, serif" font-size="16" fill="#22d3ee" text-anchor="middle" font-weight="bold" letter-spacing="2">LITTLEREADS</text>
</svg>