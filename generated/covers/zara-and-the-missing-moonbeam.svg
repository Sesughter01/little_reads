<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#1e1b4b"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#grad)"/>

  <!-- Decorations -->
  
        <circle cx="100" cy="200" r="2" fill="#fbbf24" opacity="0.7"/>
        <circle cx="500" cy="150" r="3" fill="#fbbf24" opacity="0.6"/>
        <circle cx="450" cy="300" r="2" fill="#fbbf24" opacity="0.8"/>
        <circle cx="80" cy="400" r="2.5" fill="#fbbf24" opacity="0.5"/>
        <circle cx="520" cy="500" r="2" fill="#fbbf24" opacity="0.7"/>
        <circle cx="150" cy="600" r="3" fill="#fbbf24" opacity="0.6"/>
        <circle cx="480" cy="700" r="2" fill="#fbbf24" opacity="0.5"/>
        <circle cx="300" cy="120" r="4" fill="#fbbf24" opacity="0.4"/>
      

  <!-- Category -->
  <text x="300" y="100" font-family="Georgia, serif" font-size="14" fill="#fbbf24" text-anchor="middle" letter-spacing="3" opacity="0.7">ADVENTURE</text>

  <!-- Emoji -->
  <text x="300" y="340" font-size="80" text-anchor="middle" opacity="0.9">🌙</text>

  <!-- Title -->
  <text x="300" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="300" dy="0">Zara and the</tspan><tspan x="300" dy="36">Missing Moonbeam</tspan>
  </text>

  <!-- Divider -->
  <line x1="250" y1="554" x2="350" y2="554" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>

  <!-- Author -->
  <text x="300" y="589" font-family="Georgia, serif" font-size="13" fill="white" text-anchor="middle" opacity="0.6">LittleReads Editorial Team</text>

  <!-- Brand -->
  <rect x="0" y="840" width="600" height="60" fill="black" opacity="0.3"/>
  <text x="300" y="875" font-family="Georgia, serif" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold" letter-spacing="2">LITTLEREADS</text>
</svg>