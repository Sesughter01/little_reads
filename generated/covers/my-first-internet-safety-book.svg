<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#1e293b"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#grad)"/>

  <!-- Decorations -->
  
        <path d="M300,180 L380,220 L380,320 Q380,400 300,440 Q220,400 220,320 L220,220 Z" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>
      

  <!-- Category -->
  <text x="300" y="100" font-family="Georgia, serif" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="3" opacity="0.7">TECHNOLOGY</text>

  <!-- Emoji -->
  <text x="300" y="340" font-size="80" text-anchor="middle" opacity="0.9">🛡️</text>

  <!-- Title -->
  <text x="300" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="300" dy="0">My First Internet</tspan><tspan x="300" dy="36">Safety Book</tspan>
  </text>

  <!-- Divider -->
  <line x1="250" y1="554" x2="350" y2="554" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>

  <!-- Author -->
  <text x="300" y="589" font-family="Georgia, serif" font-size="13" fill="white" text-anchor="middle" opacity="0.6">LittleReads Editorial Team</text>

  <!-- Brand -->
  <rect x="0" y="840" width="600" height="60" fill="black" opacity="0.3"/>
  <text x="300" y="875" font-family="Georgia, serif" font-size="16" fill="#38bdf8" text-anchor="middle" font-weight="bold" letter-spacing="2">LITTLEREADS</text>
</svg>