<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#1e1b4b"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9d5ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#grad)"/>

  <!-- Decorations -->
  
        <circle cx="300" cy="200" r="50" fill="#e9d5ff" opacity="0.15"/>
        <circle cx="315" cy="190" r="40" fill="#1e1b4b"/>
        <circle cx="400" cy="160" r="2" fill="#e9d5ff" opacity="0.4"/>
        <circle cx="200" cy="180" r="1.5" fill="#e9d5ff" opacity="0.3"/>
        <circle cx="420" cy="220" r="2.5" fill="#e9d5ff" opacity="0.35"/>
      

  <!-- Category -->
  <text x="300" y="100" font-family="Georgia, serif" font-size="14" fill="#e9d5ff" text-anchor="middle" letter-spacing="3" opacity="0.7">BEDTIME</text>

  <!-- Emoji -->
  <text x="300" y="340" font-size="80" text-anchor="middle" opacity="0.9">⭐</text>

  <!-- Title -->
  <text x="300" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="300" dy="0">Goodnight, Little</tspan><tspan x="300" dy="36">Explorer</tspan>
  </text>

  <!-- Divider -->
  <line x1="250" y1="554" x2="350" y2="554" stroke="#e9d5ff" stroke-width="2" opacity="0.5"/>

  <!-- Author -->
  <text x="300" y="589" font-family="Georgia, serif" font-size="13" fill="white" text-anchor="middle" opacity="0.6">LittleReads Editorial Team</text>

  <!-- Brand -->
  <rect x="0" y="840" width="600" height="60" fill="black" opacity="0.3"/>
  <text x="300" y="875" font-family="Georgia, serif" font-size="16" fill="#e9d5ff" text-anchor="middle" font-weight="bold" letter-spacing="2">LITTLEREADS</text>
</svg>