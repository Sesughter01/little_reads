<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#5b21b6"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#grad)"/>

  <!-- Decorations -->
  
        <path d="M80,600 Q200,500 300,500 Q400,500 520,600" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.2"/>
        <line x1="180" y1="520" x2="180" y2="600" stroke="#c4b5fd" stroke-width="1.5" opacity="0.15"/>
        <line x1="300" y1="500" x2="300" y2="600" stroke="#c4b5fd" stroke-width="1.5" opacity="0.15"/>
        <line x1="420" y1="520" x2="420" y2="600" stroke="#c4b5fd" stroke-width="1.5" opacity="0.15"/>
      

  <!-- Category -->
  <text x="300" y="100" font-family="Georgia, serif" font-size="14" fill="#c4b5fd" text-anchor="middle" letter-spacing="3" opacity="0.7">FRIENDSHIP</text>

  <!-- Emoji -->
  <text x="300" y="340" font-size="80" text-anchor="middle" opacity="0.9">🌉</text>

  <!-- Title -->
  <text x="300" y="444" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="300" dy="0">The Three Friends</tspan><tspan x="300" dy="36">and the Broken</tspan><tspan x="300" dy="36">Bridge</tspan>
  </text>

  <!-- Divider -->
  <line x1="250" y1="572" x2="350" y2="572" stroke="#c4b5fd" stroke-width="2" opacity="0.5"/>

  <!-- Author -->
  <text x="300" y="607" font-family="Georgia, serif" font-size="13" fill="white" text-anchor="middle" opacity="0.6">LittleReads Editorial Team</text>

  <!-- Brand -->
  <rect x="0" y="840" width="600" height="60" fill="black" opacity="0.3"/>
  <text x="300" y="875" font-family="Georgia, serif" font-size="16" fill="#c4b5fd" text-anchor="middle" font-weight="bold" letter-spacing="2">LITTLEREADS</text>
</svg>