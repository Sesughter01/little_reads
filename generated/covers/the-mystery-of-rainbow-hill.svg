<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#312e81"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#grad)"/>

  <!-- Decorations -->
  <circle cx="300" cy="450" r="200" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.08" clip-path="url(#half)"/><circle cx="300" cy="450" r="220" fill="none" stroke="#f97316" stroke-width="2" opacity="0.08" clip-path="url(#half)"/><circle cx="300" cy="450" r="240" fill="none" stroke="#eab308" stroke-width="2" opacity="0.08" clip-path="url(#half)"/><circle cx="300" cy="450" r="260" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.08" clip-path="url(#half)"/><circle cx="300" cy="450" r="280" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.08" clip-path="url(#half)"/><circle cx="300" cy="450" r="300" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.08" clip-path="url(#half)"/><circle cx="300" cy="450" r="320" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.08" clip-path="url(#half)"/>

  <!-- Category -->
  <text x="300" y="100" font-family="Georgia, serif" font-size="14" fill="#fcd34d" text-anchor="middle" letter-spacing="3" opacity="0.7">ADVENTURE</text>

  <!-- Emoji -->
  <text x="300" y="340" font-size="80" text-anchor="middle" opacity="0.9">🌈</text>

  <!-- Title -->
  <text x="300" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="300" dy="0">The Mystery of</tspan><tspan x="300" dy="36">Rainbow Hill</tspan>
  </text>

  <!-- Divider -->
  <line x1="250" y1="554" x2="350" y2="554" stroke="#fcd34d" stroke-width="2" opacity="0.5"/>

  <!-- Author -->
  <text x="300" y="589" font-family="Georgia, serif" font-size="13" fill="white" text-anchor="middle" opacity="0.6">LittleReads Editorial Team</text>

  <!-- Brand -->
  <rect x="0" y="840" width="600" height="60" fill="black" opacity="0.3"/>
  <text x="300" y="875" font-family="Georgia, serif" font-size="16" fill="#fcd34d" text-anchor="middle" font-weight="bold" letter-spacing="2">LITTLEREADS</text>
</svg>