<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#78350f"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#78350f;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#grad)"/>

  <!-- Decorations -->
  
        <path d="M0,250 Q150,220 300,250 T600,250" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.2"/>
        <path d="M0,270 Q150,240 300,270 T600,270" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.15"/>
        <path d="M0,650 Q150,620 300,650 T600,650" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.2"/>
      

  <!-- Category -->
  <text x="300" y="100" font-family="Georgia, serif" font-size="14" fill="#fbbf24" text-anchor="middle" letter-spacing="3" opacity="0.7">LIFE SKILLS</text>

  <!-- Emoji -->
  <text x="300" y="340" font-size="80" text-anchor="middle" opacity="0.9">🦁</text>

  <!-- Title -->
  <text x="300" y="444" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="300" dy="0">The Little Lion</tspan><tspan x="300" dy="36">Who Learned to</tspan><tspan x="300" dy="36">Listen</tspan>
  </text>

  <!-- Divider -->
  <line x1="250" y1="572" x2="350" y2="572" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>

  <!-- Author -->
  <text x="300" y="607" font-family="Georgia, serif" font-size="13" fill="white" text-anchor="middle" opacity="0.6">LittleReads Editorial Team</text>

  <!-- Brand -->
  <rect x="0" y="840" width="600" height="60" fill="black" opacity="0.3"/>
  <text x="300" y="875" font-family="Georgia, serif" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold" letter-spacing="2">LITTLEREADS</text>
</svg>