<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#312e81"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#grad)"/>

  <!-- Decorations -->
  <text x="80" y="180" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">1</text><text x="190" y="180" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">2</text><text x="300" y="180" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">3</text><text x="410" y="180" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">4</text><text x="520" y="180" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">5</text><text x="80" y="430" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">6</text><text x="190" y="430" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">7</text><text x="300" y="430" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">8</text><text x="410" y="430" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">9</text><text x="520" y="430" font-family="Georgia, serif" font-size="28" fill="#fcd34d" opacity="0.12">0</text>

  <!-- Category -->
  <text x="300" y="100" font-family="Georgia, serif" font-size="14" fill="#fcd34d" text-anchor="middle" letter-spacing="3" opacity="0.7">EDUCATION</text>

  <!-- Emoji -->
  <text x="300" y="340" font-size="80" text-anchor="middle" opacity="0.9">🔢</text>

  <!-- Title -->
  <text x="300" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="300" dy="0">The Boy Who</tspan><tspan x="300" dy="36">Befriended Numbers</tspan>
  </text>

  <!-- Divider -->
  <line x1="250" y1="554" x2="350" y2="554" stroke="#fcd34d" stroke-width="2" opacity="0.5"/>

  <!-- Author -->
  <text x="300" y="589" font-family="Georgia, serif" font-size="13" fill="white" text-anchor="middle" opacity="0.6">LittleReads Editorial Team</text>

  <!-- Brand -->
  <rect x="0" y="840" width="600" height="60" fill="black" opacity="0.3"/>
  <text x="300" y="875" font-family="Georgia, serif" font-size="16" fill="#fcd34d" text-anchor="middle" font-weight="bold" letter-spacing="2">LITTLEREADS</text>
</svg>