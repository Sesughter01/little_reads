<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Background -->
  <rect width="600" height="900" fill="#166534"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#166534;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#grad)"/>

  <!-- Decorations -->
  <circle cx="327.78991226096264" cy="350" r="20" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.15"/><circle cx="220.1641569067852" cy="390" r="20" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.15"/><circle cx="215.91376494746535" cy="430" r="20" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.15"/><circle cx="375.84874448653" cy="470" r="20" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.15"/><circle cx="295.82530407967766" cy="510" r="20" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.15"/>

  <!-- Category -->
  <text x="300" y="100" font-family="Georgia, serif" font-size="14" fill="#fbbf24" text-anchor="middle" letter-spacing="3" opacity="0.7">MONEY SKILLS</text>

  <!-- Emoji -->
  <text x="300" y="340" font-size="80" text-anchor="middle" opacity="0.9"> piggy</text>

  <!-- Title -->
  <text x="300" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">
    <tspan x="300" dy="0">Amina Learns to</tspan><tspan x="300" dy="36">Save</tspan>
  </text>

  <!-- Divider -->
  <line x1="250" y1="554" x2="350" y2="554" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>

  <!-- Author -->
