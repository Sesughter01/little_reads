  <line x1="11" y1="19" x2="19" y2="19" stroke="white" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round"/>
  <line x1="11" y1="23" x2="20" y2="23" stroke="white" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round"/>
  <!-- Page lines right -->
